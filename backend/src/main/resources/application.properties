spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/stayby_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

stayby.jwt.secret=${JWT_SECRET}
stayby.jwt.expiration=86400000

# =========================================================
# EMAIL
# =========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

payhere.merchant-id=${PAYHERE_MERCHANT_ID}
payhere.merchant-secret=${PAYHERE_MERCHANT_SECRET}
payhere.sandbox=${PAYHERE_SANDBOX:true}
payhere.notify-url=${PAYHERE_NOTIFY_URL}
stayby.frontend-url=${FRONTEND_URL:http://localhost:5173}
payhere.app-id=${PAYHERE_APP_ID:}
payhere.app-secret=${PAYHERE_APP_SECRET:}

stayby.booking.pending-expiry-hours=48
stayby.booking.payment-expiry-hours=24

spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=30MB